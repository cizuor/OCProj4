server.port=9000


# --- BASE DE DONNÉES MYSQL ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.format_sql=true


# met a jour mais n'efface pas les données
spring.jpa.hibernate.ddl-auto=update

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# On cache le SQL en prod pour ne pas polluer les logs
spring.jpa.show-sql=false

spring.sql.init.mode=never

oc.app.jwtSecret=${TOKEN_SECRET}
oc.app.jwtExpirationMs=86400000





