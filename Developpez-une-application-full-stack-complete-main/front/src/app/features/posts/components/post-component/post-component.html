<div class="page-container">
  <!-- En-tête avec flèche et titre -->
  <div class="header-section">
    <img src="assets/back.png" class="btn-back" [routerLink]="['/articles']" alt="Retour">
    <h1>Créer un nouvel article</h1>
  </div>

  <div class="form-wrapper">
    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
      
      <div class="form-field">
        <select id="topicId" formControlName="topicId">
          <option value="" disabled selected>Sélectionner un thème</option>
          @for (topic of topics; track $index) {
            <option [value]="topic?.id">{{ topic?.title }}</option>
          }
        </select>
      </div>

      <div class="form-field">
        <input id="titre" type="text" formControlName="titre" placeholder="Titre de l'article">
      </div>

      <div class="form-field">
        <textarea id="contenu" formControlName="contenu" rows="8" placeholder="Contenu de l'article"></textarea>
      </div>

      <div class="form-actions">
        <button type="submit" [disabled]="postForm.invalid" class="btn-submit">
          Créer
        </button>
      </div>

    </form>
  </div>
</div>
