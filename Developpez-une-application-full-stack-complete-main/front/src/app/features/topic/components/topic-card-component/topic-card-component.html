<div class="topic-card">
    <div class="content">
        <h3>{{ topic.title }}</h3>
        <p class="topic-description">
            Description: {{ topic.description }}
        </p>
        
        <div class="button-wrapper">
            @if (!topic.liked) {
                <button (click)="toggle()" class="btn btn-subscribe">S'abonner</button>
            }
             @else if (isProfileMode) {
                <button (click)="toggle()" class="btn btn-subscribe">Se désabonner</button>
            } 
            @else {
                <button class="btn btn-disabled" disabled>Déjà abonné</button>
            }
        </div>
    </div>
</div>
