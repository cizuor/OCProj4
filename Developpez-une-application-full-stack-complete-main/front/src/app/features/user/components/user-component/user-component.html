<div class="page-container">
  <div class="profile-container">
    <h1>Profil utilisateur</h1>

      <form [formGroup]="userForm" (ngSubmit)="onSave()" class="profile-form">
      <div class="form-group">
        <input type="text" formControlName="pseudo" placeholder="Username">
      </div>
      
      <div class="form-group">
        <input type="email" formControlName="email" placeholder="Email">
      </div>

      <div class="form-group">
        <input type="password" formControlName="password" placeholder="Mot de passe">
      </div>

      <button type="submit" class="btn-save" [disabled]="userForm.invalid">
        Sauvegarder
      </button>
    </form>

  </div>
  <div class="topic-container">
    <hr class="separator">

    
      <section class="subscriptions-section">
          <h2>Abonnements </h2>
          <div class="topics-grid">
              @for (topic of lTopics; track topic.id) {
                  <app-topic-card 
                      [topic]="topic"
                      [isProfileMode]="true" 
                      (onToggle)="handleSubscription(topic)">
                  </app-topic-card>
              }
          </div>
      </section>

  </div>
</div>
