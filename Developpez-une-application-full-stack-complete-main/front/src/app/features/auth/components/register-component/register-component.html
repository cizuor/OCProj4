
<div class="page-container">
  <div class="register-container">
    <h2>Inscription</h2>
    
    <form [formGroup]="form" (ngSubmit)="submit()" class="register-form">

      <div class="form-field">
        <label for="pseudo">Nom d'utilisateur</label>
        <input id="pseudo" type="text" formControlName="pseudo">
      </div>

      <div class="form-field">
        <label for="email">Adresse e-mail</label>
        <input id="email" type="email" formControlName="email">
      </div>
      <div class="form-field">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" formControlName="password">
      </div>
      
      <div class="form-actions">
        <button type="submit" [disabled]="form.invalid" class="btn-submit">
          S'inscrire
        </button>
      </div>

      @if (error) {
        <p class="error">Une erreur est survenue lors de l'inscription.</p>
      }
    </form>
  </div>
</div>
